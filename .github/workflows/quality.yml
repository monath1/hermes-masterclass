name: Quality

on:
  pull_request:
  push:
    branches: [codex/hermes-masterclass-first-edition]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python tools/check_book.py
      - run: mkdocs build --strict
      - run: codespell docs README.md CONTRIBUTING.md research
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail '**/*.md'
