name: Quality

on:
  pull_request:
  push:
    branches: [codex/hermes-masterclass-first-edition]
  workflow_dispatch:
    inputs:
      live_task8_sources:
        description: Verify Task 8 official pages, redirect domains, and content anchors
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python tools/check_book.py --final
      - run: mkdocs build --strict
      - run: codespell docs README.md CONTRIBUTING.md research
      - run: python -m py_compile tools/*.py tests/*.py
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            #site/**
            #.venv/**
            #.superpowers/**
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --root-dir .
            --no-progress
            --exclude-loopback
            --exclude-path 'site'
            --exclude-path '.venv'
            --exclude-path '.superpowers'
            '**/*.md'
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v2026.8.19
          path: .pinned-hermes-source
          fetch-depth: 1
      - run: python tools/check_task6.py --hermes-source .pinned-hermes-source
      - run: python tools/check_task7.py --hermes-source .pinned-hermes-source
      - run: python tools/check_task8.py --hermes-source .pinned-hermes-source
      - run: python tools/check_task9.py --hermes-source .pinned-hermes-source
      - run: python tools/check_task10.py --hermes-source .pinned-hermes-source
      - run: python tools/check_task11.py --hermes-source .pinned-hermes-source
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_task8_sources }}
        run: python tools/check_task8.py --hermes-source .pinned-hermes-source --live
