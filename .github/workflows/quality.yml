name: Quality

on:
  pull_request:
  push:
    branches: [codex/hermes-masterclass-first-edition]
  workflow_dispatch:
    inputs:
      live_task8_sources:
        description: Verify Task 8 official pages, redirect domains, and content anchors
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: bash tools/verify_release.sh
        env:
          HERMES_TASK8_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live_task8_sources && '1' || '0' }}
