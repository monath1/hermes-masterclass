site_name: Hermes Agent Masterclass
site_description: A practical operating handbook for Hermes Agent on a Mac mini.
site_url: http://127.0.0.1:8000/
repo_name: monath1/hermes-masterclass
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: hermes-light
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: hermes-dark
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.footer, navigation.tracking, navigation.top, search.highlight, search.suggest, content.code.copy]
  font: {text: Source Sans 3, code: JetBrains Mono}
nav:
  - Home: index.md
  - About this edition: about.md
exclude_docs: |
  superpowers/**
  assets/images/PROVENANCE.md
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/extra.js]
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true, line_spans: __span, pygments_lang_class: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist: {custom_checkbox: true}
plugins: [search, mermaid2]
