site_name: Hermes Agent Masterclass
site_description: A practical operating handbook for Hermes Agent on a Mac mini.
site_url: http://127.0.0.1:8000/
site_author: Moumita Nath
repo_url: https://github.com/monath1/hermes-masterclass
repo_name: monath1/hermes-masterclass
copyright: Curated by Moumita Nath · First edition · Private local handbook
theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.svg
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.footer, navigation.tracking, navigation.top, search.highlight, search.suggest, content.code.copy]
nav:
  - Home: index.md
  - Part I — From Chatbot to Colleague:
      - "1. Meet Hermes: An Agent That Stays on the Job": part-1/01-meet-hermes.md
      - "2. Agentic AI From First Principles": part-1/02-agentic-ai-first-principles.md
      - "3. The Hermes Loop": part-1/03-hermes-loop.md
      - "4. Write the Job Description": part-1/04-write-the-job-description.md
  - Part II — Build the Mac mini Foundation:
      - "5. Install Hermes CLI, Desktop, and Web Dashboard": part-2/05-install-hermes-on-mac-mini.md
      - "6. Choose Models and Route Work": part-2/06-models-and-routing.md
      - "7. Personality, Context, Sessions, and Memory": part-2/07-personality-context-sessions-memory.md
      - "8. Tools, Skills, Plugins, and MCP": part-2/08-tools-skills-plugins-mcp.md
      - "9. Message Hermes Everywhere": part-2/09-message-hermes-everywhere.md
      - "10. Goals and Background Operations": part-2/10-goals-and-background-operations.md
  - Part III — Build the Trust Envelope:
      - "11. The Family-Safe Security Architecture": part-3/11-family-safe-security.md
      - "12. Identities, Burner Accounts, and Secrets": part-3/12-identities-burner-accounts-secrets.md
      - "13. Approvals, Autonomy, Egress, and Audit": part-3/13-approvals-autonomy-egress-audit.md
      - "14. Sensitive Data, Backups, and Recovery": part-3/14-sensitive-data-backups-recovery.md
  - Part IV — Your Personal Chief of Staff:
      - "15. Daily and Weekly Operating Rhythms": part-4/15-daily-weekly-operating-rhythms.md
      - "16. The Job-Search and Opportunity Pipeline": part-4/16-job-search-opportunity-pipeline.md
      - "17. Résumé, Interview, and Brand Overhaul": part-4/17-resume-interview-brand.md
      - "18. Family Operations in Canada": part-4/18-family-operations-canada.md
  - Part V — Your First Digital Employee:
      - "19. The One- or Two-Person Business OS": part-5/19-one-two-person-business-os.md
      - "20. Research, Sales, Marketing, Support, and Finance": part-5/20-business-functions.md
      - "21. Hermes as Manager": part-5/21-hermes-as-manager.md
  - Part VI — Advanced Operations:
      - "22. Evaluation, Observability, and the 90-Day Capstone": part-6/22-evaluation-observability-capstone.md
  - Appendices:
      - "Appendix A: Commands and interface reference": appendices/appendix-a-command-reference.md
      - "Appendix B: Copy-ready templates and playbooks": appendices/appendix-b-templates-playbooks.md
      - "Appendix C: Curated Hermes extension stack": appendices/appendix-c-curated-stack.md
      - "Appendix D: Troubleshooting, glossary, bibliography, and provenance": appendices/appendix-d-troubleshooting-glossary-bibliography.md
  - About: about.md
exclude_docs: |
  superpowers/**
  reference/editorial-audit.md
extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css
extra_javascript:
  - assets/vendor/mermaid/10.4.0/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/extra.js
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true, line_spans: __span, pygments_lang_class: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist: {custom_checkbox: true}
plugins: [search]
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/monath1
      name: Moumita Nath on GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/monath1/hermes-masterclass
      name: Hermes Agent Masterclass repository
